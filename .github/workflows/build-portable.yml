name: 构建便携版 EXE

on:
  workflow_dispatch: # 手动触发:Actions 页面点 "Run workflow"
  push:
    tags:
      - 'v*' # 推送 v1.0.0 等标签时自动触发

jobs:
  build-windows:
    name: 构建 Windows 单文件 EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用 Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 构建 Tauri 应用(单文件 exe)
        run: npm run tauri build -- --no-bundle

      - name: 上传便携版 exe 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ModTrans-便携版
          path: src-tauri/target/release/modtrans.exe

      - name: 发布到 GitHub Release(仅打标签时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/modtrans.exe
